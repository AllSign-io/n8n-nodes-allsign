name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: 'npm ci'

      - name: No retired AllSign domains
        run: |
          ! grep -rnE 'dashboard\.allsign\.io|docs\.allsign\.io|developers\.allsign\.io' . \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            --exclude='*.test.ts' --exclude=CHANGELOG.md

      - name: Run tests
        run: 'npm test'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'
